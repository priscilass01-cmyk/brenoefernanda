  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #f7efeb; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }
    .invite {
      position: relative;
      width: min(100vw, 1024px);
      line-height: 0;
    }
    .invite img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }
    .hotspot {
      position: absolute;
      display: block;
      z-index: 5;
      background: transparent;
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .hotspot:focus-visible {
      outline: 2px solid rgba(92, 58, 35, .8);
      outline-offset: 2px;
      border-radius: 8px;
    }

    /* Coordinates are based on the 1024 x 1536 original artwork. */
    .confirmar { left: 265px; top: 1350px; width: 145px; height: 135px; }
    .mapa      { left: 416px; top: 1350px; width: 145px; height: 135px; }
    .presentes { left: 568px; top: 1350px; width: 145px; height: 135px; }
    .traje     { left: 716px; top: 1350px; width: 135px; height: 135px; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(35, 22, 15, .42);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.open { display: flex; }
    .card {
      width: min(420px, 100%);
      background: #fffaf7;
      color: #5c3a23;
      border: 1px solid #c8a98f;
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0,0,0,.18);
      line-height: 1.45;
    }
    .card h2 { margin: 0 0 10px; font-size: 25px; font-weight: 500; }
    .card p { margin: 0 0 20px; font-size: 17px; }
    .close {
      border: 1px solid #9f7958;
      background: transparent;
      color: #5c3a23;
      border-radius: 999px;
      padding: 9px 20px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>

      <p>O traje para a celebração é <strong>social</strong>.</p>
      <button class="close" type="button" onclick="document.getElementById('dressModal').classList.remove('open')">Fechar</button>
    </div>
  </div>

  <script>
    const modal = document.getElementById('dressModal');
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') modal.classList.remove('open');
    });
  </script>
</body>
</html>
